name: Pre-commit

on:
  pull_request:
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: codebuild-semoss-github-runner-${{ github.run_id }}-${{ github.run_attempt }}
    container: public.ecr.aws/docker/library/python:3.12-bookworm
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
        
    - name: Install dependencies and run frontend linting
      run: |
        if [ -d "client" ]; then
          pnpm install
          pnpm exec biome format --write && pnpm exec biome lint
        else
          echo "No client directory found, skipping frontend linting"
        fi
    
    # Python 3.12 is provided by the container
    # Official pre-commit action handles caching automatically
    - uses: pre-commit/action@v3.0.1
      with:
        extra_args: --all-files --show-diff-on-failure
