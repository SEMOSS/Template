name: Pre-commit

on:
  pull_request:
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: codebuild-semoss-github-runner-${{ github.run_id }}-${{ github.run_attempt }}
    container: public.ecr.aws/docker/library/python:3.12-bookworm
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
        
    - name: Install dependencies and run frontend linting
      run: |
        if [ -d "client" ]; then
          pnpm install
          pnpm exec biome format --write && pnpm exec biome lint
        else
          echo "No client directory found, skipping frontend linting"
        fi
    
    # Python 3.12 is provided by the container
    - name: Compute pre-commit cache key
      id: pc-key
      run: echo "hash=$(sha256sum .pre-commit-config.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Cache pre-commit environments
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ steps.pc-key.outputs.hash }}
        restore-keys: |
          pre-commit-

    - name: Run pre-commit
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.local/bin:$PATH"
        uv tool install pre-commit
        uv tool run pre-commit run --all-files --show-diff-on-failure
