name: Run Unit Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'CI version snapshot'
        required: true
        default: '5.3.0-SNAPSHOT'
        type: choice
        options:
          - '5.3.0-SNAPSHOT'
          # Add other snapshot versions as needed here!
      clean_install:
        description: 'Run `mvn clean install -U` to force-update dependencies'
        required: true
        default: false
        type: boolean

jobs:
  test:
    name: Run Test Suite
    runs-on: codebuild-semoss-github-runner-${{ github.run_id }}-${{ github.run_attempt }}
    container: public.ecr.aws/docker/library/maven:3.9.9-amazoncorretto-21-debian
    env:
      SNAPSHOT: ${{ inputs.snapshot || '5.3.0-SNAPSHOT' }}
      CLEAN_INSTALL: ${{ inputs.clean_install || 'false' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Computes a cache key from the root pom.xml. This project is a single-module
      # Maven project, so hashing the root pom.xml alone is sufficient.
      #
      # For a multi-module Maven project, hash every pom.xml in the tree instead:
      #   run: echo "hash=$(find . -name pom.xml -not -path '*/target/*' -print0 \
      #     | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      #
      # Note: we compute the hash in a shell step instead of using the built-in
      # hashFiles() expression because hashFiles() fails on this self-hosted
      # CodeBuild runner due to a workspace-path resolution issue.
      - name: Compute pom.xml hash
        id: pom-hash
        run: echo "hash=$(sha256sum pom.xml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache Maven packages
        id: cache-maven
        uses: actions/cache@v4
        with:
          path: /root/.m2/repository
          key: ${{ runner.os }}-maven-${{ steps.pom-hash.outputs.hash }}-${{ env.SNAPSHOT }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ steps.pom-hash.outputs.hash }}-
            ${{ runner.os }}-maven-

      - name: Maven Install
        if: steps.cache-maven.outputs.cache-hit != 'true' || env.CLEAN_INSTALL == 'true'
        run: |
          echo "Clean install: ${CLEAN_INSTALL}"
          echo "Version snapshot: ${SNAPSHOT}"
          if [ "${CLEAN_INSTALL}" = "true" ]; then
            echo "Running mvn clean install with -U flag"
            mvn -B clean install -U -DskipTests=true -Dci.version="${SNAPSHOT}"
          else
            echo "Running mvn install without -U flag"
            mvn -B install -DskipTests=true -Dci.version="${SNAPSHOT}"
          fi
            
      - name: Run Unit Tests
        run: mvn -B ${{ steps.cache-maven.outputs.cache-hit == 'true' && '-o' || '' }} test -Dci.version="${SNAPSHOT}"
          