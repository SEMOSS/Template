name: Run Unit Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'CI version snapshot'
        required: true
        default: '5.2.0-SNAPSHOT'
        type: choice
        options:
          - '5.2.0-SNAPSHOT'
          # Add other snapshot versions as needed here!
      clean_install:
        description: 'Run `mvn clean install -U` to force-update dependencies'
        required: true
        default: false
        type: boolean

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    container: maven:3.9.9-amazoncorretto-21-debian
    env:
      SNAPSHOT: ${{ inputs.snapshot || '5.2.0-SNAPSHOT' }}
      CLEAN_INSTALL: ${{ inputs.clean_install || 'false' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Cache Maven packages
        id: cache-maven
        uses: actions/cache@v4
        with:
          path: /root/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ env.SNAPSHOT }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-
            ${{ runner.os }}-maven-

      - name: Maven Install
        if: steps.cache-maven.outputs.cache-hit != 'true' || env.CLEAN_INSTALL == 'true'
        run: |
          echo "Clean install: ${CLEAN_INSTALL}"
          echo "Version snapshot: ${SNAPSHOT}"
          if [ "${CLEAN_INSTALL}" = "true" ]; then
            echo "Running mvn clean install with -U flag"
            mvn -B clean install -U -DskipTests=true -Dci.version="${SNAPSHOT}"
          else
            echo "Running mvn install without -U flag"
            mvn -B install -DskipTests=true -Dci.version="${SNAPSHOT}"
          fi
            
      - name: Run Unit Tests
        run: mvn -B ${{ steps.cache-maven.outputs.cache-hit == 'true' && '-o' || '' }} test -Dci.version="${SNAPSHOT}"
          